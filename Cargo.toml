[package]
name = "lsw1_autosplitter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
asr = { git = "https://github.com/LiveSplit/asr", rev = "06f244ead9d700618b5bd22b0ddb334c0c791b57", features = ["derive", "flags"] }

bytemuck = { version = "1", features = ["min_const_generics"] }

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
codegen-units = 1
strip = true
