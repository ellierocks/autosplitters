name: ci
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The target (wasm32-unknown-unknown) comes from .cargo/config.toml.
      - run: cargo build --release --locked --workspace
      - run: cargo clippy --release --locked --workspace -- -D warnings
      - run: cargo fmt --all --check
      # Tests run on the host; the no_std lib itself only links for wasm, hence --tests for clippy.
      - run: cargo test --workspace --target x86_64-unknown-linux-gnu --locked
      - run: cargo clippy --workspace --target x86_64-unknown-linux-gnu --locked --tests -- -D warnings
